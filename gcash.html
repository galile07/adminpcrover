<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCROVER GCash Payment</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css?v=32" />
</head>
<body class="page-dashboard">
  <div class="layout-shell">
    <aside class="sidebar">
      <div class="login-brand">
        <div class="brand-mark">PC</div>
        <div>
          <span class="brand-title">ROVER</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link"><span>Dashboard</span></a>
        <a href="pos.html" class="nav-link"><span>POS System</span></a>
        <a href="orders.html" class="nav-link"><span><span class="nav-badge" id="navBadgeOrders"></span>Online Orders</span></a>
        <a href="inventory.html" class="nav-link"><span><span class="nav-badge" id="navBadgeInventory"></span>Inventory</span></a>
        <a href="automation.html" class="nav-link"><span>Price Automation</span></a>
        <a href="gcash.html" class="nav-link active"><span>GCash Payment</span></a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="header">
        <div class="header-info">GCash Payment</div>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="openGcashHistory()">History</button>
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark/light mode">Dark</button>
          <button class="btn btn-secondary" onclick="location.href='index.html'">Log out</button>
        </div>
      </header>

      <section class="page-content" id="gcashPage">
        <div class="card gcash-card">
          <div class="form-group">
            <label>Name on GCash</label>
            <input type="text" id="gcashName" class="form-input" placeholder="e.g. Juan.Dela.Cruz" autocomplete="off" />
            <p class="field-hint">Letters and period only.</p>
          </div>
          <div class="form-group">
            <label>GCash Number</label>
            <input type="text" id="gcashPhone" class="form-input" placeholder="09XXXXXXXXX" inputmode="numeric" maxlength="11" autocomplete="off" />
            <p class="field-hint">11 digits only.</p>
          </div>
          <div class="form-group">
            <label>GCash QR Code</label>
            <input type="file" id="gcashQrInput" class="form-input" accept="image/*" />
            <div class="gcash-qr-box">
              <img id="gcashQrPreview" class="gcash-qr" alt="GCash QR code" style="display:none;" />
              <p id="gcashQrEmpty" class="gcash-qr-empty">No QR photo uploaded yet.</p>
            </div>
          </div>
          <button class="btn btn-primary" id="gcashSaveBtn">Save Settings</button>
        </div>
      </section>

      <div id="gcashHistoryModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
          <div class="modal-header">
            <h3>GCash Settings History</h3>
            <button class="modal-close" onclick="closeGcashHistory()">&times;</button>
          </div>
          <div class="modal-body">
            <ul class="gcash-history-list" id="gcashHistoryList"></ul>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeGcashHistory()" style="color:var(--text-muted);border:1px solid var(--border-strong);background:transparent;padding:10px 24px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">Close</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/script.js?v=62"></script>
</body>
</html>
