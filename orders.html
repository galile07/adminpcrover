<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCROVER Online Orders</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css?v=26" />
</head>
<body class="page-dashboard">
  <div class="layout-shell">
    <aside class="sidebar">
      <div class="login-brand">
        <div class="brand-mark">PC</div>
        <div>
          <span class="brand-title">ROVER</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link"><span>Dashboard</span></a>
        <a href="pos.html" class="nav-link"><span>POS System</span></a>
        <a href="orders.html" class="nav-link active"><span><span class="nav-badge" id="navBadgeOrders"></span>Online Orders</span></a>
        <a href="inventory.html" class="nav-link"><span><span class="nav-badge" id="navBadgeInventory"></span>Inventory</span></a>
        <a href="automation.html" class="nav-link"><span>Price Automation</span></a>
        <a href="sync.html" class="nav-link"><span>Sync Settings</span></a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="header">
        <div class="header-info">Online Orders</div>
        <div class="header-actions">
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark/light mode">Dark</button>
          <button class="btn btn-secondary" onclick="location.href='index.html'">Log out</button>
        </div>
      </header>
      
      <nav class="sub-nav">
        <button class="sub-nav-item active" data-status="pending">To Accept</button>
        <button class="sub-nav-item" data-status="shipped">To Deliver</button>
        <button class="sub-nav-item" data-status="delivered">To Finish</button>
        <button class="sub-nav-item" data-status="completed">Finished</button>
        <button class="sub-nav-item" data-status="cancelled">Cancelled</button>
      </nav>

      <section class="page-content">
        <div class="order-search-row" id="cancelledSearchRow" style="display:none;">
          <input type="text" id="cancelledSearch" class="modal-select" placeholder="Search cancelled orders by order code..." />
        </div>
        <div id="ordersContainer" class="orders-container"></div>
      </section>

      <div id="orderModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
          <div class="modal-header">
            <h3>Order Information</h3>
            <button class="modal-close" onclick="closeOrderModal()">&times;</button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer" id="modalFooter"></div>
        </div>
      </div>

      <div id="cancelModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
          <div class="modal-header">
            <h3>Cancel Order</h3>
            <button class="modal-close" onclick="closeCancelModal()">&times;</button>
          </div>
          <div class="modal-body">
            <p class="modal-note" id="cancelModalNote">This order will be cancelled and moved to the Cancelled tab.</p>
            <div class="form-group">
              <span style="display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;">Reason for cancellation</span>
              <select id="cancelReasonSelect" class="modal-select">
                <option value="inventory issue">Inventory issue</option>
                <option value="price issue">Price issue</option>
                <option value="operational overload">Operational overload</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeCancelModal()">Close</button>
            <button class="btn btn-primary" onclick="confirmCancelOrder()">Confirm Cancellation</button>
          </div>
        </div>
      </div>


    </main>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/script.js?v=40"></script>
</body>
</html>
