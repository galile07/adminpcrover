<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCROVER Inventory Management</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css?v=29" />
</head>
<body class="page-dashboard">
  <div class="layout-shell">
    <aside class="sidebar">
      <div class="login-brand">
        <div class="brand-mark">PC</div>
        <div>
          <span class="brand-title">ROVER</span>
        </div>
      </div>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link"><span>Dashboard</span></a>
        <a href="pos.html" class="nav-link"><span>POS System</span></a>
        <a href="orders.html" class="nav-link"><span><span class="nav-badge" id="navBadgeOrders"></span>Online Orders</span></a>
        <a href="inventory.html" class="nav-link active"><span><span class="nav-badge" id="navBadgeInventory"></span>Inventory</span></a>
        <a href="automation.html" class="nav-link"><span>Price Automation</span></a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="header">
        <div class="header-info">Inventory</div>
        <div class="header-actions">
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark/light mode">Dark</button>
          <button class="btn btn-secondary" onclick="location.href='index.html'">Log out</button>
        </div>
      </header>
      <section class="page-content">
          <div class="section-heading">
            <h2>Products</h2>
            <div style="display:flex;gap:10px;">
              <button class="btn btn-primary" onclick="openAddProductModal()">+ Add Product</button>
            </div>
          </div>
          <nav class="sub-nav">
            <button class="sub-nav-item active" data-source="all" onclick="filterInventory('all')">All Products</button>
            <button class="sub-nav-item" data-source="inventory" onclick="filterInventory('inventory')">Inventory</button>
            <button class="sub-nav-item" data-source="imported" onclick="filterInventory('imported')">Imported</button>
          </nav>
        <div class="card table-card">
          <div class="inventory-search-row" style="padding:16px 20px 0;">
            <input type="text" id="inventorySearch" class="form-input" placeholder="Search products by name or category...">
          </div>
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th style="width:140px;text-align:center;">Action</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody"></tbody>
          </table>
          <div id="inventoryPagination" class="table-pagination"></div>
        </div>
      </section>

      <div id="productModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
          <div class="modal-header">
            <h3 id="productModalTitle">Add Product</h3>
            <button class="modal-close" onclick="closeProductModal()">&times;</button>
          </div>
          <div class="modal-body">
            <form id="productForm" autocomplete="off">
              <input type="hidden" id="editProductId">
              <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="productName" class="form-input" required>
              </div>
              <div class="form-group">
                <label>Description (for customer view)</label>
                <textarea id="productDescription" class="form-input" rows="2" style="resize:vertical;"></textarea>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Price (in Peso)</label>
                  <input type="number" id="productPrice" class="form-input" required min="0">
                </div>
                <div class="form-group">
                  <label>Stock</label>
                  <input type="number" id="productStock" class="form-input" required min="0">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Low Stock Threshold</label>
                  <input type="number" id="productThreshold" class="form-input" required min="0">
                </div>
              </div>
              <input type="hidden" id="productEnabled" value="checked">
              <div class="form-group">
                <label>Product Image</label>
                <input type="file" id="productImage" class="form-input" accept="image/*" onchange="previewImage(event)">
                <div id="imagePreview" class="image-preview"></div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button id="deleteProductBtn" class="btn btn-danger" onclick="deleteProduct()" style="display:none;background:#dc3545;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">Delete</button>
            <button class="btn btn-secondary" onclick="closeProductModal()" style="color:var(--text-muted);border:1px solid var(--border-strong);background:transparent;padding:10px 24px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
            <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
          </div>
        </div>
      </div>

      <!-- Imported product edit modal -->
      <div id="importProductModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
          <div class="modal-header">
            <h3 id="importProductModalTitle">Edit Imported Product</h3>
            <button class="modal-close" onclick="closeImportProductModal()">&times;</button>
          </div>
          <div class="modal-body">
            <form autocomplete="off">
              <input type="hidden" id="editImportProductId">
              <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="importProductName" class="form-input" required>
              </div>
              <div class="form-group">
                <label>Description (for customer view)</label>
                <textarea id="importProductDescription" class="form-input" rows="2" style="resize:vertical;"></textarea>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Price (in Peso)</label>
                  <input type="number" id="importProductPrice" class="form-input" required min="0">
                </div>
                <div class="form-group">
                  <label>Stock</label>
                  <input type="number" id="importProductStock" class="form-input" required min="0">
                </div>
              </div>
              <input type="hidden" id="importProductEnabled" value="checked">
            </form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeImportProductModal()" style="color:var(--text-muted);border:1px solid var(--border-strong);background:transparent;padding:10px 24px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
            <button class="btn btn-primary" onclick="saveImportProduct()">Save</button>
          </div>
        </div>
      </div>

    </main>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/script.js?v=52"></script>
</body>
</html>
